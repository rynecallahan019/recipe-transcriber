services:
  - type: web
    name: recipe-transcriber
    runtime: python
    plan: free
    buildCommand: pip install -U -r requirements.txt && python -c "import static_ffmpeg; static_ffmpeg.add_paths()"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TRANSCRIBER_API_KEY
        sync: false
